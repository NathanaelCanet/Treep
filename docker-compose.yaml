version: '3.8'

services:
  # --- Service Base de Données ---
  db:
    image: postgres:15
    container_name: treep_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: treepdb
    ports:
      - "5432:5432" # Expose le port pour que vous puissiez vérifier la DB depuis votre PC
    volumes:
      - ./pgdata:/var/lib/postgresql/data # Persistance des données
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d treepdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Service Backend Spring Boot ---
  backend:
    build: ./backend # Docker va chercher le Dockerfile dans ce dossier
    container_name: treep_backend
    ports:
      - "8080:8080" # On expose l'API pour que JavaFX (sur votre PC) puisse lui parler
    depends_on:
      db:
        condition: service_healthy # Attend que la DB soit vraiment prête
    environment:
      # ATTENTION : Ici, on n'utilise pas 'localhost' mais 'db' (le nom du service ci-dessus)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/treepdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update