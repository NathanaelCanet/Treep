<main class="main">
  <div class="content">
    <h1>Hello, {{ title() }}</h1>
    
    @if (backendStatus(); as status) {
      <div class="status-card">
        <h2>Backend Status</h2>
        <p><strong>Status:</strong> {{ status.status }}</p>
        <p><strong>Message:</strong> {{ status.message }}</p>
      </div>
    } @else {
      <p>Loading backend status...</p>
    }
  </div>
</main>

<router-outlet />
